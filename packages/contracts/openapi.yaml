        - activo
        - suspendido
        - baja
    Tenant:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - cuit
        - moneda
        - zonaHoraria
        - estado
        - tieneOperaciones
        - moduloFacturacion
        - creadoEn
      properties:
        id: &a21
          type: string
          format: uuid
        nombre:
          type: string
        cuit:
          type:
            - string
            - 'null'
        moneda:
          type: string
          pattern: ^[A-Z]{3}$
        zonaHoraria:
          type: string
