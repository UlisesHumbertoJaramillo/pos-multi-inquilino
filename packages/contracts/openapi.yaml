        - nombre
        - tipo
        - recargoPct
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 60
        tipo:
          $ref: '#/components/schemas/PaymentType'
        recargoPct:
          type: string
          description: Por ejemplo "10" o "-5".
    PaymentMethodUpdateRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 60
        recargoPct:
          type: string
    Category:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - tasaIva
        - activa
      properties:
        id: &a72
          type: string
          format: uuid
        nombre:
          type: string
        tasaIva:
          type: string
          pattern: ^-?\d+\.\d{4}$
          description: Porcentaje con cuatro decimales.
        activa:
          type: boolean
    CategoryCreateRequest:
      type: object
      additionalProperties: false
      required:
        - nombre
        - tasaIva
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        tasaIva: &a71
