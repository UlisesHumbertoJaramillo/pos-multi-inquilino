        - siempre
        - opcional_con_factura
        - opcional_sin_factura
    TenantParameters:
      type: object
      additionalProperties: false
      required:
        - inactividadCarritoMin
        - inactividadSesionMin
        - plazoRegularizacionHoras
        - plazoDevolucionDias
        - toleranciaArqueo
        - politicaFacturacion
        - plazoFacturacionPosteriorDias
      properties:
        inactividadCarritoMin:
          type: integer
