    CategoryUpdateRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        tasaIva: *a71
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - tipo
        - nombre
        - codigoBarras
        - categoriaId
        - costo
        - precioCombo
        - activo
        - tieneImagen
        - disponible
      properties:
        id: *a72
        tipo: &a75
          type: string
          enum:
            - simple
            - combo
        nombre: &a76
          type: string
        codigoBarras: &a77
          type:
            - string
            - 'null'
        categoriaId: &a78
          type:
            - string
            - 'null'
          format: uuid
        costo: &a79
          type: &a73
            - string
            - 'null'
          pattern: ^\d+\.\d{2}$
          description: Costo sin IVA; null en un combo.
        precioCombo: &a80
