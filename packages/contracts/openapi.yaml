        plazoRegularizacionHoras:
          type: integer
        plazoDevolucionDias:
          type: integer
        toleranciaArqueo:
          type: string
        politicaFacturacion:
          $ref: '#/components/schemas/BillingPolicy'
        plazoFacturacionPosteriorDias:
          type: integer
    PaymentType:
