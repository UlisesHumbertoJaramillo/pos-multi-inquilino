# Integración continua: todo cambio pasa `npm run verify` antes de integrarse (Const. 8 y 9).
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Crea los roles pos_owner y pos_app, las bases pos_dev y pos_test, y el .env con contraseñas al azar.
      - name: Preparar PostgreSQL
        run: npm run db:setup
        env:
          PGPASSWORD: postgres

      - run: npm run verify
