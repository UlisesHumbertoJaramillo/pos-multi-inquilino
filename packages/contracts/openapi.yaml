        '401': *a4
        '403': *a5
    post:
      operationId: createPaymentMethod
      tags:
        - Organización
      summary: Crear un método de pago
      description: Con recargo (positivo) o descuento (negativo), dentro de los márgenes (RF-135). Solo el AC de su comercio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodCreateRequest'
      responses:
        '201':
          description: Método creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400': *a6
        '401': *a4
        '403': *a5
        '409': *a7
  /organizacion/metodos-pago/{id}:
    patch:
      operationId: updatePaymentMethod
      tags:
        - Organización
      summary: Modificar un método de pago
      description: Solo el AC de su comercio.
      parameters: *a8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodUpdateRequest'
      responses:
        '200':
          description: Método modificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400': *a6
        '401': *a4
        '403': *a5
        '404': *a9
        '409': *a7
  /organizacion/metodos-pago/{id}/baja:
    post:
      operationId: deactivatePaymentMethod
      tags:
        - Organización
      summary: Dar de baja un método de pago
      description: Solo el AC de su comercio.
      parameters: *a8
      responses:
        '204': *a10
        '400': *a6
        '401': *a4
        '403': *a5
        '404': *a9
        '409': *a7
components:
  securitySchemes:
    tokenAcceso:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso de vida corta, obtenido con /auth/login o /auth/renovar.
  responses:
    BadRequest:
      description: Datos inválidos o token de un solo uso inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Sin token válido, credenciales incorrectas o sesión vencida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: El rol activo o el ámbito no permiten la acción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: No existe, o pertenece a otro comercio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Una regla de negocio impidió la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Locked:
      description: Credencial bloqueada por intentos fallidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Se superó el límite de frecuencia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - estado
      properties:
        estado:
          type: string
          const: ok
    ApiError:
      description: Respuesta de error uniforme, sin detalles internos (Const. 17).
      type: object
      additionalProperties: false
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          description: Código estable, para que el frontend decida qué mostrar.
        mensaje:
          type: string
          description: Mensaje para el usuario, en español.
    Message:
      type: object
      additionalProperties: false
      required:
        - mensaje
      properties:
        mensaje:
          type: string
    Role:
      type: string
      enum:
        - SA
        - AC
        - AS
        - VO
    SessionUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - nombre
        - comercioId
        - roles
        - rolActivo
        - sucursales
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        nombre:
          type: string
        comercioId:
          description: Nulo para el Super Administrador.
          type:
            - string
            - 'null'
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        rolActivo:
          description: Nulo hasta que el usuario elige su rol en el primer ingreso.
          oneOf:
            - $ref: '#/components/schemas/Role'
            - type: 'null'
        sucursales:
          description: Sucursales del rol activo.
          type: array
          items:
            type: string
            format: uuid
    SessionTokens:
      type: object
      additionalProperties: false
      required:
        - tokenAcceso
        - tokenAccesoVenceEn
        - tokenRenovacion
        - sesionVenceEn
        - usuario
        - requiereElegirRol
      properties:
        tokenAcceso:
          type: string
        tokenAccesoVenceEn:
          type: string
          format: date-time
        tokenRenovacion:
          type: string
        sesionVenceEn:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/SessionUser'
        requiereElegirRol:
          type: boolean
    ActiveRoleChange:
      type: object
      additionalProperties: false
      required:
        - tokenAcceso
        - tokenAccesoVenceEn
        - usuario
      properties:
        tokenAcceso:
          type: string
        tokenAccesoVenceEn:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/SessionUser'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - contrasena
      properties:
        email:
          type: string
          format: email
        contrasena:
          type: string
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - tokenRenovacion
      properties:
        tokenRenovacion:
          type: string
    ActiveRoleRequest:
      type: object
      additionalProperties: false
      required:
        - rol
      properties:
        rol:
          $ref: '#/components/schemas/Role'
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - nuevaContrasena
      properties:
        token:
          type: string
        nuevaContrasena:
          type: string
          minLength: 10
          maxLength: 128
    PinRequest:
      type: object
      additionalProperties: false
      required:
        - pin
      properties:
        pin:
          type: string
          pattern: ^[0-9]{4,6}$
    AuthorizationType:
      type: string
      enum:
        - descuento
        - credito
        - anulacion
        - reembolso
        - retiro
        - pago_por_verificar
        - cierre_forzado
    AuthorizeRequest:
      type: object
      additionalProperties: false
      required:
        - tipo
        - operacionRef
        - sucursalId
        - autorizanteId
        - pin
      properties:
        tipo:
          $ref: '#/components/schemas/AuthorizationType'
        operacionRef:
          type: string
          description: Operación concreta que se autoriza (por ejemplo, el id de la venta).
        sucursalId:
          type: string
          format: uuid
        autorizanteId:
          type: string
          format: uuid
        pin:
          type: string
    Authorization:
      type: object
      additionalProperties: false
      required:
        - id
        - tipo
        - operacionRef
        - sucursalId
        - solicitanteId
        - autorizanteId
        - emitidaEn
        - usada
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/AuthorizationType'
        operacionRef:
          type: string
        sucursalId:
          type: string
          format: uuid
        solicitanteId:
          type: string
          format: uuid
        autorizanteId:
          type: string
          format: uuid
        emitidaEn:
          type: string
          format: date-time
        usada:
          type: boolean
    TenantStatus:
      type: string
      enum:
        - activo
        - suspendido
        - baja
    Tenant:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - cuit
        - moneda
        - zonaHoraria
        - estado
        - tieneOperaciones
        - moduloFacturacion
        - creadoEn
      properties:
        id: &a12
          type: string
          format: uuid
        nombre:
          type: string
        cuit:
          type:
            - string
            - 'null'
        moneda:
          type: string
          pattern: ^[A-Z]{3}$
        zonaHoraria:
          type: string
        estado:
          $ref: '#/components/schemas/TenantStatus'
        tieneOperaciones:
          type: boolean
        moduloFacturacion:
          type: boolean
        creadoEn: &a13
          type: string
          format: date-time
    TenantCreateRequest:
      type: object
      additionalProperties: false
      required:
        - nombre
        - moneda
        - zonaHoraria
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        cuit:
          type:
            - string
            - 'null'
          description: CUIT con o sin guiones; se valida el dígito verificador.
        moneda:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código ISO 4217, por ejemplo ARS.
        zonaHoraria:
          type: string
          description: Zona horaria IANA, por ejemplo America/Argentina/Buenos_Aires.
    TenantUpdateRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        cuit:
          type:
            - string
            - 'null'
        moneda:
          type: string
          pattern: ^[A-Z]{3}$
        zonaHoraria:
          type: string
    BillingModuleRequest:
      type: object
      additionalProperties: false
      required:
        - activo
      properties:
        activo:
          type: boolean
    NewAccountRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - nombre
      properties:
        email:
          type: string
          format: email
        nombre:
          type: string
          minLength: 1
          maxLength: 120
    CreatedAccount:
      type: object
      additionalProperties: false
      required:
        - usuarioId
        - email
      properties:
        usuarioId: *a12
        email:
          type: string
    TicketStatus:
      type: string
      enum:
        - abierto
        - respondido
        - cerrado
    TicketSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - comercioId
        - comercioNombre
        - asunto
        - estado
        - creadoEn
        - actualizadoEn
      properties:
        id: *a12
        comercioId: *a12
        comercioNombre:
          type: string
        asunto:
          type: string
        estado:
          $ref: '#/components/schemas/TicketStatus'
        creadoEn: *a13
        actualizadoEn: *a13
    TicketMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - deSoporte
        - texto
        - creadoEn
      properties:
        id: *a12
        deSoporte:
          type: boolean
          description: true si lo escribió el soporte de la plataforma.
        texto:
          type: string
        creadoEn: *a13
    TicketDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - comercioId
        - comercioNombre
        - asunto
        - estado
        - creadoEn
        - actualizadoEn
        - mensajes
      properties:
        id: *a12
        comercioId: *a12
        comercioNombre:
          type: string
        asunto:
          type: string
        estado:
          $ref: '#/components/schemas/TicketStatus'
        creadoEn: *a13
        actualizadoEn: *a13
        mensajes:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'
    TicketCreateRequest:
      type: object
      additionalProperties: false
      required:
        - asunto
        - mensaje
      properties:
        asunto:
          type: string
          minLength: 1
          maxLength: 200
        mensaje:
          type: string
          minLength: 1
          maxLength: 4000
    TicketReplyRequest:
      type: object
      additionalProperties: false
      required:
        - texto
      properties:
        texto:
          type: string
          minLength: 1
          maxLength: 4000
    TechnicalAuditEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - momento
        - tipoEvento
        - actorId
        - comercioId
        - ip
        - detalle
      properties:
        id: *a12
        momento: *a13
        tipoEvento:
          type: string
        actorId:
          type: &a14
            - string
            - 'null'
          format: uuid
        comercioId:
          type: *a14
          format: uuid
          description: 'Solo como referencia: nunca acompaña datos comerciales.'
        ip:
          type:
            - string
            - 'null'
        detalle:
          type: object
          description: 'Detalle técnico plano: solo valores simples.'
          additionalProperties:
            type:
              - string
              - number
              - boolean
              - 'null'
    TechnicalPanel:
      type: object
      additionalProperties: false
      required:
        - erroresRecientes
        - trabajos
        - outbox
      properties:
        erroresRecientes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - momento
              - metodo
              - ruta
              - error
            properties:
              momento: *a13
              metodo:
                type: string
              ruta:
                type: string
              error:
                type: string
        trabajos:
          type: object
          additionalProperties: false
          required:
            - pendientes
            - enCurso
            - fallidos
          properties:
            pendientes:
              type: integer
            enCurso:
              type: integer
            fallidos:
              type: integer
        outbox:
          type: object
          additionalProperties: false
          required:
            - pendientes
            - conErrores
            - pendienteMasAntiguo
          properties:
            pendientes:
              type: integer
            conErrores:
              type: integer
            pendienteMasAntiguo:
              type:
                - string
                - 'null'
              format: date-time
    Branch:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - direccion
        - activa
      properties:
        id: &a15
          type: string
          format: uuid
        nombre:
          type: string
        direccion:
          type:
            - string
            - 'null'
        activa:
          type: boolean
    Register:
      type: object
      additionalProperties: false
      required:
        - id
        - sucursalId
        - nombre
        - puntoVentaFiscal
        - activa
      properties:
        id: *a15
        sucursalId: *a15
        nombre:
          type: string
        puntoVentaFiscal:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 99999
        activa:
          type: boolean
    Structure:
      type: object
      additionalProperties: false
      required:
        - comercio
        - sucursales
      properties:
        comercio:
          type: object
          additionalProperties: false
          required:
            - id
            - nombre
          properties:
            id: *a15
            nombre:
              type: string
        sucursales:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - nombre
              - direccion
              - activa
              - cajas
            properties:
              id: *a15
              nombre:
                type: string
              direccion:
                type:
                  - string
                  - 'null'
              activa:
