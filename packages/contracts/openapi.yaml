          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
    TenantUserCreateRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - nombre
        - roles
      properties:
        email:
          type: string
          format: email
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RoleAssignment'
    UserRolesRequest:
      type: object
      additionalProperties: false
