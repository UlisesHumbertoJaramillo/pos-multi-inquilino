          additionalProperties: false
          required:
            - id
            - nombre
          properties:
            id: *a70
            nombre:
              type: string
        sucursales:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - nombre
              - direccion
              - activa
              - cajas
            properties:
              id: *a70
              nombre:
                type: string
              direccion:
                type:
                  - string
                  - 'null'
              activa:
                type: boolean
              cajas:
                type: array
                items:
                  $ref: '#/components/schemas/Register'
    BranchCreateRequest:
      type: object
      additionalProperties: false
      required:
        - nombre
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        direccion:
          type:
            - string
            - 'null'
          maxLength: 200
    BranchUpdateRequest:
      type: object
      additionalProperties: false
