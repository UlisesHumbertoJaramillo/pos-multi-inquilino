openapi: 3.1.0
info:
  title: API del Sistema POS Multi-Inquilino
  version: 0.1.0
  description: >-
    Contrato entre el frontend y el backend (Const. 15, AD-21). Se escribe antes de implementar
    cada endpoint, y los tipos de packages/contracts se generan desde este archivo.
    Todo endpoint exige token de API, salvo los de la lista blanca de AD-22 (Const. 16).
servers:
  - url: https://localhost:3000
    description: Desarrollo local
tags:
  - name: Sistema
    description: Estado del sistema.
paths:
  /salud:
    get:
      operationId: getHealth
      tags: [Sistema]
      summary: Salud del sistema
      description: Público. Responde solo el estado, sin versiones ni datos internos.
      security: []
      responses:
        '200':
          description: El sistema está en funcionamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado:
          type: string
          const: ok
    ApiError:
      description: Respuesta de error uniforme, sin detalles internos (Const. 17).
      type: object
      additionalProperties: false
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          description: Código estable, para que el frontend decida qué mostrar.
        mensaje:
          type: string
          description: Mensaje para el usuario, en español.
