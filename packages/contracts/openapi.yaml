          maximum: 480
        plazoRegularizacionHoras:
          type: integer
          minimum: 24
          maximum: 240
        plazoDevolucionDias:
          type: integer
          minimum: 0
          maximum: 365
        toleranciaArqueo:
          type: string
          pattern: ^\d+\.\d{2}$
