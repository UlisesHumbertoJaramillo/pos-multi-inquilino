        - porcentaje_costo
        - por_grupo
      description: 'fijo: precio cargado a mano. porcentaje_costo: costo × (1 + margen) × (1 + IVA). por_grupo: igual, con un margen por categoría.'
    PriceRule:
      type: object
      additionalProperties: false
      required:
        - tipo
      properties:
        tipo:
          $ref: '#/components/schemas/PriceRuleType'
        porcentaje:
          type: string
          description: Margen sobre el costo. Obligatorio salvo en precio fijo.
        porCategoria:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            format: uuid
          description: Margen por categoría (regla por grupo).
    PriceList:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - regla
        - activa
      properties:
        id: *a26
        nombre:
          type: string
        regla:
          $ref: '#/components/schemas/PriceRule'
        activa:
          type: boolean
    PriceListCreateRequest:
      type: object
      additionalProperties: false
      required:
        - nombre
        - regla
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        regla:
          $ref: '#/components/schemas/PriceRule'
    PriceListUpdateRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        regla:
          $ref: '#/components/schemas/PriceRule'
    PriceSheet:
      type: object
      additionalProperties: false
      required:
        - lista
        - precios
      properties:
        lista:
          $ref: '#/components/schemas/PriceList'
        precios:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - productoId
              - nombre
              - codigoBarras
              - tipo
              - categoria
              - precioFinal
            properties:
              productoId: *a26
              nombre:
                type: string
              codigoBarras:
                type:
                  - string
                  - 'null'
              tipo:
                type: string
                enum:
                  - simple
                  - combo
              categoria:
                type:
                  - string
                  - 'null'
              precioFinal:
                type: *a27
                pattern: ^\d+\.\d{2}$
                description: Precio final con IVA; null si no tiene precio en esta lista.
    ManualPriceRequest:
      type: object
      additionalProperties: false
      required:
        - precio
      properties:
        precio:
          type:
            - string
            - 'null'
          description: Precio final con IVA, o null para quitarlo.
    BranchPriceList:
      type: object
      additionalProperties: false
      required:
        - sucursalId
        - nombre
        - listaId
      properties:
        sucursalId: *a26
        nombre:
          type: string
        listaId: *a32
    BranchPriceListRequest:
      type: object
      additionalProperties: false
      required:
        - listaId
      properties:
        listaId: *a26
