        - asunto
        - estado
        - creadoEn
        - actualizadoEn
        - mensajes
      properties:
        id: *a21
        comercioId: *a21
        comercioNombre:
          type: string
        asunto:
          type: string
        estado:
          $ref: '#/components/schemas/TicketStatus'
        creadoEn: *a22
        actualizadoEn: *a22
        mensajes:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'
    TicketCreateRequest:
      type: object
      additionalProperties: false
      required:
        - asunto
        - mensaje
      properties:
        asunto:
          type: string
          minLength: 1
          maxLength: 200
        mensaje:
          type: string
          minLength: 1
          maxLength: 4000
    TicketReplyRequest:
      type: object
      additionalProperties: false
      required:
