      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        direccion:
          type:
            - string
            - 'null'
          maxLength: 200
    RegisterCreateRequest:
      type: object
      additionalProperties: false
      required:
        - nombre
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 60
        puntoVentaFiscal:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 99999
    RegisterUpdateRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 60
        puntoVentaFiscal:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 99999
    RoleAssignment:
      type: object
      additionalProperties: false
