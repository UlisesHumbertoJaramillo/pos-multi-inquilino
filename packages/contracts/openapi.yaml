        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Entradas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialAuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /perifericos/estado:
    post:
      operationId: reportPeripheral
      tags:
        - Periféricos
      summary: Informar el estado de un periférico
      description: El POS informa la falla o la recuperación de la impresora o el lector. Solo se registran los cambios, en la auditoría técnica (T-241).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeripheralReport'
      responses:
        '200':
          description: Recibido.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - registrado
                properties:
                  registrado:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    tokenAcceso:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso de vida corta, obtenido con /auth/login o /auth/renovar.
  responses:
    BadRequest:
      description: Datos inválidos o token de un solo uso inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Sin token válido, credenciales incorrectas o sesión vencida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: El rol activo o el ámbito no permiten la acción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: No existe, o pertenece a otro comercio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Una regla de negocio impidió la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Locked:
      description: Credencial bloqueada por intentos fallidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Se superó el límite de frecuencia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: El cuerpo de la solicitud supera el tamaño permitido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - estado
      properties:
        estado:
          type: string
          const: ok
    ApiError:
      description: Respuesta de error uniforme, sin detalles internos (Const. 17).
      type: object
      additionalProperties: false
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          description: Código estable, para que el frontend decida qué mostrar.
        mensaje:
          type: string
          description: Mensaje para el usuario, en español.
    Message:
      type: object
      additionalProperties: false
      required:
        - mensaje
      properties:
        mensaje:
          type: string
    Role:
      type: string
      enum:
        - SA
        - AC
        - AS
        - VO
    SessionUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - nombre
        - comercioId
        - roles
        - rolActivo
        - sucursales
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        nombre:
          type: string
        comercioId:
          description: Nulo para el Super Administrador.
          type:
            - string
            - 'null'
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        rolActivo:
          description: Nulo hasta que el usuario elige su rol en el primer ingreso.
          oneOf:
            - $ref: '#/components/schemas/Role'
            - type: 'null'
        sucursales:
          description: Sucursales del rol activo.
          type: array
          items:
            type: string
            format: uuid
    SessionTokens:
      type: object
      additionalProperties: false
      required:
        - tokenAcceso
        - tokenAccesoVenceEn
        - tokenRenovacion
        - sesionVenceEn
        - usuario
        - requiereElegirRol
      properties:
        tokenAcceso:
          type: string
        tokenAccesoVenceEn:
          type: string
          format: date-time
        tokenRenovacion:
          type: string
        sesionVenceEn:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/SessionUser'
        requiereElegirRol:
          type: boolean
    ActiveRoleChange:
      type: object
      additionalProperties: false
      required:
        - tokenAcceso
        - tokenAccesoVenceEn
        - usuario
      properties:
        tokenAcceso:
          type: string
        tokenAccesoVenceEn:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/SessionUser'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - contrasena
      properties:
        email:
          type: string
          format: email
        contrasena:
          type: string
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - tokenRenovacion
      properties:
        tokenRenovacion:
          type: string
    ActiveRoleRequest:
      type: object
      additionalProperties: false
      required:
        - rol
      properties:
        rol:
          $ref: '#/components/schemas/Role'
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - nuevaContrasena
      properties:
        token:
          type: string
        nuevaContrasena:
          type: string
          minLength: 10
          maxLength: 128
    PinRequest:
      type: object
      additionalProperties: false
      required:
        - pin
      properties:
        pin:
          type: string
          pattern: ^[0-9]{4,6}$
    AuthorizationType:
      type: string
      enum:
        - descuento
        - credito
        - anulacion
        - reembolso
        - retiro
        - pago_por_verificar
        - cierre_forzado
    AuthorizeRequest:
      type: object
      additionalProperties: false
      required:
        - tipo
        - operacionRef
        - sucursalId
        - autorizanteId
        - pin
      properties:
        tipo:
          $ref: '#/components/schemas/AuthorizationType'
        operacionRef:
          type: string
          description: Operación concreta que se autoriza (por ejemplo, el id de la venta).
        sucursalId:
          type: string
          format: uuid
        autorizanteId:
          type: string
          format: uuid
        pin:
          type: string
    Authorization:
      type: object
      additionalProperties: false
      required:
        - id
        - tipo
        - operacionRef
        - sucursalId
        - solicitanteId
        - autorizanteId
        - emitidaEn
        - usada
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/AuthorizationType'
        operacionRef:
          type: string
        sucursalId:
          type: string
          format: uuid
        solicitanteId:
          type: string
          format: uuid
        autorizanteId:
          type: string
          format: uuid
        emitidaEn:
          type: string
          format: date-time
        usada:
          type: boolean
    TenantStatus:
      type: string
      enum:
        - activo
        - suspendido
        - baja
    Tenant:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - cuit
        - moneda
        - zonaHoraria
        - estado
        - tieneOperaciones
        - moduloFacturacion
        - creadoEn
      properties:
        id: &a67
          type: string
          format: uuid
        nombre:
          type: string
        cuit:
          type:
            - string
            - 'null'
        moneda:
          type: string
          pattern: ^[A-Z]{3}$
        zonaHoraria:
          type: string
        estado:
          $ref: '#/components/schemas/TenantStatus'
        tieneOperaciones:
          type: boolean
        moduloFacturacion:
          type: boolean
        creadoEn: &a68
          type: string
          format: date-time
    TenantCreateRequest:
      type: object
      additionalProperties: false
      required:
        - nombre
        - moneda
        - zonaHoraria
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        cuit:
          type:
            - string
            - 'null'
          description: CUIT con o sin guiones; se valida el dígito verificador.
        moneda:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código ISO 4217, por ejemplo ARS.
        zonaHoraria:
          type: string
          description: Zona horaria IANA, por ejemplo America/Argentina/Buenos_Aires.
    TenantUpdateRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        cuit:
          type:
            - string
            - 'null'
        moneda:
          type: string
          pattern: ^[A-Z]{3}$
        zonaHoraria:
          type: string
    BillingModuleRequest:
      type: object
      additionalProperties: false
      required:
        - activo
      properties:
        activo:
          type: boolean
    NewAccountRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - nombre
      properties:
        email:
          type: string
          format: email
        nombre:
          type: string
          minLength: 1
          maxLength: 120
    CreatedAccount:
      type: object
      additionalProperties: false
      required:
        - usuarioId
        - email
      properties:
        usuarioId: *a67
        email:
          type: string
    TicketStatus:
      type: string
      enum:
        - abierto
        - respondido
        - cerrado
    TicketSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - comercioId
        - comercioNombre
        - asunto
        - estado
        - creadoEn
        - actualizadoEn
      properties:
        id: *a67
        comercioId: *a67
        comercioNombre:
          type: string
        asunto:
          type: string
        estado:
          $ref: '#/components/schemas/TicketStatus'
        creadoEn: *a68
        actualizadoEn: *a68
    TicketMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - deSoporte
        - texto
        - creadoEn
      properties:
        id: *a67
        deSoporte:
          type: boolean
          description: true si lo escribió el soporte de la plataforma.
        texto:
          type: string
        creadoEn: *a68
    TicketDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - comercioId
        - comercioNombre
        - asunto
        - estado
        - creadoEn
        - actualizadoEn
        - mensajes
      properties:
        id: *a67
        comercioId: *a67
        comercioNombre:
          type: string
        asunto:
          type: string
        estado:
          $ref: '#/components/schemas/TicketStatus'
        creadoEn: *a68
        actualizadoEn: *a68
        mensajes:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'
    TicketCreateRequest:
      type: object
      additionalProperties: false
      required:
        - asunto
        - mensaje
      properties:
        asunto:
          type: string
          minLength: 1
          maxLength: 200
        mensaje:
          type: string
          minLength: 1
          maxLength: 4000
    TicketReplyRequest:
      type: object
      additionalProperties: false
      required:
        - texto
      properties:
        texto:
          type: string
          minLength: 1
          maxLength: 4000
    TechnicalAuditEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - momento
        - tipoEvento
        - actorId
        - comercioId
        - ip
        - detalle
      properties:
        id: *a67
        momento: *a68
        tipoEvento:
          type: string
        actorId:
          type: &a69
            - string
            - 'null'
          format: uuid
        comercioId:
          type: *a69
          format: uuid
          description: 'Solo como referencia: nunca acompaña datos comerciales.'
        ip:
          type:
            - string
            - 'null'
        detalle:
          type: object
          description: 'Detalle técnico plano: solo valores simples.'
          additionalProperties:
            type:
              - string
              - number
              - boolean
              - 'null'
    TechnicalPanel:
      type: object
      additionalProperties: false
      required:
        - erroresRecientes
        - trabajos
        - outbox
        - perifericosConFalla
      properties:
        erroresRecientes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - momento
              - metodo
              - ruta
              - error
            properties:
              momento: *a68
              metodo:
                type: string
              ruta:
                type: string
              error:
                type: string
        trabajos:
          type: object
          additionalProperties: false
          required:
            - pendientes
            - enCurso
            - fallidos
          properties:
            pendientes:
              type: integer
            enCurso:
              type: integer
            fallidos:
              type: integer
        outbox:
          type: object
          additionalProperties: false
          required:
            - pendientes
            - conErrores
            - pendienteMasAntiguo
          properties:
            pendientes:
              type: integer
            conErrores:
              type: integer
            pendienteMasAntiguo:
              type:
                - string
                - 'null'
              format: date-time
        perifericosConFalla:
          type: array
          description: Periféricos cuyo último estado informado es una falla (T-241). Sin datos comerciales.
          items:
            type: object
            additionalProperties: false
            required:
              - momento
              - comercioId
              - comercio
              - dispositivo
              - conexion
              - motivo
            properties:
              momento:
                type: string
                format: date-time
              comercioId:
                type: string
                format: uuid
              comercio:
                type: string
              dispositivo:
                type: string
              conexion:
                type: string
              motivo:
                type:
                  - string
                  - 'null'
    Branch:
      type: object
