      parameters: *a8
      responses:
        '204': &a10
          description: Hecho.
        '400': *a6
        '401': *a4
        '403': *a5
        '404': *a9
        '409': *a7
  /organizacion/sucursales/{id}/cajas:
    post:
      operationId: createRegister
      tags:
        - Organización
      summary: Crear una caja en una sucursal
      description: RF-024. Solo el AC de su comercio.
      parameters: *a8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCreateRequest'
      responses:
        '201':
          description: Caja creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
        '400': *a6
        '401': *a4
        '403': *a5
        '404': *a9
        '409': *a7
  /organizacion/cajas/{id}:
    patch:
      operationId: updateRegister
      tags:
        - Organización
      summary: Modificar una caja
      description: Solo el AC de su comercio.
      parameters: *a8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUpdateRequest'
      responses:
        '200':
          description: Caja modificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
        '400': *a6
        '401': *a4
        '403': *a5
        '404': *a9
        '409': *a7
  /organizacion/cajas/{id}/baja:
    post:
      operationId: deactivateRegister
      tags:
        - Organización
      summary: Dar de baja una caja
      description: RF-025. Solo el AC de su comercio.
      parameters: *a8
      responses:
        '204': *a10
        '400': *a6
        '401': *a4
        '403': *a5
        '404': *a9
        '409': *a7
  /organizacion/usuarios:
    get:
      operationId: listTenantUsers
      tags:
        - Organización
      summary: Usuarios del comercio
      description: Solo el AC de su comercio.
      responses:
        '200':
          description: Usuarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantUser'
        '401': *a4
        '403': *a5
    post:
      operationId: createTenantUser
      tags:
        - Organización
      summary: Crear un usuario del comercio
      description: Con sus roles y sucursales (RF-026). La cuenta se activa por correo. Solo el AC de su comercio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUserCreateRequest'
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccount'
        '400': *a6
        '401': *a4
        '403': *a5
        '409': *a7
  /organizacion/usuarios/{id}/roles:
    put:
      operationId: changeUserRoles
      tags:
        - Organización
      summary: Cambiar los roles de un usuario
      description: Reemplaza sus roles; queda en la auditoría comercial. El comercio no se queda sin AC. Solo el AC de su comercio.
      parameters: *a8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRolesRequest'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUser'
        '400': *a6
        '401': *a4
        '403': *a5
        '404': *a9
        '409': *a7
  /organizacion/usuarios/{id}/baja:
    post:
      operationId: deactivateTenantUser
      tags:
        - Organización
      summary: Dar de baja un usuario
      description: Cierra sus sesiones. No se puede con turno abierto ni a uno mismo. Solo el AC de su comercio.
      parameters: *a8
      responses:
        '204': *a10
        '400': *a6
        '401': *a4
        '403': *a5
        '404': *a9
        '409': *a7
  /organizacion/parametros:
    get:
      operationId: getTenantParameters
      tags:
        - Organización
      summary: Parámetros del comercio
      description: RF-135. Solo el AC de su comercio.
      responses:
        '200':
          description: Parámetros vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantParameters'
        '401': *a4
        '403': *a5
    patch:
      operationId: updateTenantParameters
      tags:
        - Organización
      summary: Modificar parámetros
      description: Dentro de los márgenes de la plataforma (RF-135). La política de facturación exige el módulo activo. Solo el AC de su comercio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantParametersUpdateRequest'
      responses:
        '200':
          description: Parámetros vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantParameters'
        '400': *a6
        '401': *a4
        '403': *a5
        '409': *a7
  /organizacion/metodos-pago:
    get:
      operationId: listPaymentMethods
      tags:
        - Organización
      summary: Métodos de pago
      description: Solo el AC de su comercio.
