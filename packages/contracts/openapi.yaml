openapi: 3.1.0
info:
  title: API del Sistema POS Multi-Inquilino
  version: 0.5.0
  description: 'Contrato entre el frontend y el backend (Const. 15, AD-21). Se escribe antes de implementar cada endpoint, y los tipos de packages/contracts se generan desde este archivo. Todo endpoint exige un token de acceso (Bearer), salvo los de la lista blanca de AD-22, que declaran `security: []` (Const. 16).'
servers:
  - url: https://localhost:3000
    description: Desarrollo local
security:
  - tokenAcceso: []
tags:
  - name: Sistema
    description: Estado del sistema.
  - name: Acceso
    description: Inicio de sesión, rol activo, validación de correo y recuperación de contraseña.
  - name: Autorizaciones
    description: PIN y autorizaciones in situ de un solo uso.
  - name: Plataforma
    description: Comercios, cuentas, tickets, auditoría técnica y panel del SA.
  - name: Soporte
    description: Tickets de soporte del comercio.
  - name: Organización
    description: Sucursales, cajas, usuarios, parámetros y métodos de pago del comercio (AC).
  - name: Catálogo
    description: Categorías con IVA, productos con imagen, combos, listas de precios y su asignación a sucursales (AC).
paths:
  /salud:
    get:
      operationId: getHealth
      tags:
        - Sistema
      summary: Salud del sistema
      description: Público. Responde solo el estado, sin versiones ni datos internos.
      security: []
      responses:
        '200':
          description: El sistema está en funcionamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/login:
    post:
      operationId: login
      tags:
        - Acceso
      summary: Iniciar sesión
      description: Público. Con un correo validado y la contraseña correcta, inicia la sesión con el último rol usado; en el primer ingreso con varios roles, `requiereElegirRol` es true (RF-005). 5 intentos fallidos seguidos bloquean la credencial 15 minutos (RF-145).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/renovar:
    post:
      operationId: refreshSession
      tags:
        - Acceso
      summary: Renovar la sesión
      description: Público (se autentica con el token de renovación). Rota el token de renovación y emite un token de acceso nuevo. Falla tras la inactividad configurada (RF-009).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Sesión renovada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/cerrar-sesion:
    post:
      operationId: logout
      tags:
        - Acceso
      summary: Cerrar la sesión
      description: 'Revoca la sesión: su token de renovación deja de servir.'
      responses:
        '204':
          description: Sesión cerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sesion:
    get:
      operationId: getCurrentSession
      tags:
        - Acceso
      summary: Sesión actual
      description: Usuario, comercio, rol activo y sucursales, tomados del token (T-035).
      responses:
        '200':
          description: Datos de la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/rol-activo:
    put:
      operationId: selectActiveRole
      tags:
        - Acceso
      summary: Elegir o cambiar el rol activo
      description: Cambia el rol activo sin cerrar la sesión. El token nuevo lleva los permisos y el ámbito del rol elegido (RF-010, RF-011).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveRoleRequest'
      responses:
        '200':
          description: Rol activo cambiado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveRoleChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/validacion/reenviar:
    post:
      operationId: resendEmailValidation
      tags:
        - Acceso
      summary: Reenviar el correo de validación
      description: Público. Responde lo mismo exista o no la cuenta (RF-006).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Pedido recibido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/validacion/confirmar:
    post:
      operationId: confirmEmail
      tags:
        - Acceso
      summary: Validar el correo
      description: Público. El token del enlace sirve una sola vez.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Correo validado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/recuperacion/solicitar:
    post:
      operationId: requestPasswordReset
      tags:
        - Acceso
      summary: Pedir la recuperación de la contraseña
      description: Público. Responde lo mismo exista o no la cuenta (RF-007).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Pedido recibido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/recuperacion/restablecer:
    post:
      operationId: resetPassword
      tags:
        - Acceso
      summary: Restablecer la contraseña
      description: Público. Rechaza un token vencido o ya usado (RF-008) y cierra todas las sesiones.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña cambiada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/pin:
    put:
      operationId: setAuthorizationPin
      tags:
        - Autorizaciones
      summary: Fijar el propio PIN de autorización
      description: Solo un AS o un AC (RF-141). El PIN se guarda con hash (RF-156).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
      responses:
        '204':
          description: PIN guardado.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /autorizaciones:
    post:
      operationId: authorizeOperation
      tags:
        - Autorizaciones
      summary: Autorizar una operación con PIN
      description: El solicitante es el usuario del token. Autoriza un AS de la sucursal o un AC presente, nunca el propio solicitante (RF-113, RF-141). La autorización es de un solo uso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '201':
          description: Autorización emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
  /autorizaciones/{id}:
    get:
      operationId: getAuthorization
      tags:
        - Autorizaciones
      summary: Consultar una autorización
      description: Un recurso de otro comercio se responde como inexistente (RF-002).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: La autorización.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/activacion:
    post:
      operationId: activateAccount
      tags:
        - Acceso
      summary: Activar una cuenta nueva
      description: Público. Con el token del correo de activación, la persona elige su contraseña y su correo queda validado (RF-015).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Cuenta activada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /plataforma/comercios:
    get:
      operationId: listTenants
      tags:
        - Plataforma
      summary: Listar comercios
      description: Solo el SA (RF-013).
      responses:
        '200':
          description: Comercios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
        '401': &a1
          $ref: '#/components/responses/Unauthorized'
        '403': &a2
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createTenant
      tags:
        - Plataforma
      summary: Dar de alta un comercio
      description: Solo el SA. Fija la moneda y la zona horaria (RF-013). El alta queda en la auditoría técnica.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Comercio creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '409':
          $ref: '#/components/responses/Conflict'
  /plataforma/comercios/{id}:
    get:
      operationId: getTenant
      tags:
        - Plataforma
      summary: Consultar un comercio
      description: Solo el SA.
      parameters: &a3
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: El comercio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTenant
      tags:
        - Plataforma
      summary: Modificar un comercio
      description: Solo el SA. La moneda no cambia si el comercio tiene operaciones (RF-134).
      parameters: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: Comercio modificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /plataforma/comercios/{id}/suspension:
    post:
      operationId: suspendTenant
      tags:
        - Plataforma
      summary: Suspender un comercio
      description: Solo el SA. Cierra al instante las sesiones de sus usuarios y publica el evento de suspensión (RF-014, RF-146).
      parameters: *a3
      responses:
        '200':
          description: Comercio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /plataforma/comercios/{id}/reactivacion:
    post:
      operationId: reactivateTenant
      tags:
        - Plataforma
      summary: Reactivar un comercio
      description: Solo el SA. Solo un comercio suspendido.
      parameters: *a3
      responses:
        '200':
          description: Comercio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /plataforma/comercios/{id}/baja:
    post:
      operationId: closeTenant
      tags:
        - Plataforma
      summary: Dar de baja un comercio
      description: Solo el SA. Baja lógica, solo sin comprobantes fiscales por regularizar (RF-147). Los datos se conservan.
      parameters: *a3
      responses:
        '200':
          description: Comercio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /plataforma/comercios/{id}/modulo-facturacion:
    put:
      operationId: setTenantBillingModule
      tags:
        - Plataforma
      summary: Activar o desactivar el módulo de facturación
      description: Solo el SA. Desactivarlo con comprobantes sin regularizar se rechaza (RF-163, RF-164).
      parameters: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingModuleRequest'
      responses:
        '200':
          description: Comercio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /plataforma/comercios/{id}/administrador:
    post:
      operationId: createFirstTenantAdmin
      tags:
        - Plataforma
      summary: Crear el primer AC de un comercio
      description: Solo el SA, y solo si el comercio no tiene AC. La cuenta se activa por correo (RF-015).
      parameters: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /plataforma/administradores:
    post:
      operationId: createPlatformAdmin
      tags:
        - Plataforma
      summary: Crear otro SA
      description: Solo el SA. La cuenta se activa por correo (RF-015).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '409':
          $ref: '#/components/responses/Conflict'
  /plataforma/tickets:
    get:
      operationId: listAllTickets
      tags:
        - Plataforma
      summary: Tickets de todos los comercios
      description: Solo el SA (RF-017).
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TicketStatus'
      responses:
        '200':
          description: Tickets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
  /plataforma/tickets/{id}:
    get:
      operationId: getTicketForSupport
      tags:
        - Plataforma
      summary: Consultar un ticket
      description: Solo el SA.
      parameters: *a3
      responses:
        '200':
          description: El ticket con su conversación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '404':
          $ref: '#/components/responses/NotFound'
  /plataforma/tickets/{id}/respuestas:
    post:
      operationId: replyTicket
      tags:
        - Plataforma
      summary: Responder un ticket
      description: Solo el SA.
      parameters: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketReplyRequest'
      responses:
        '200':
          description: El ticket con la respuesta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /plataforma/tickets/{id}/cierre:
    post:
      operationId: closeTicket
      tags:
        - Plataforma
      summary: Cerrar un ticket
      description: Solo el SA.
      parameters: *a3
      responses:
        '200':
          description: El ticket cerrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '404':
          $ref: '#/components/responses/NotFound'
  /plataforma/auditoria-tecnica:
    get:
      operationId: queryTechnicalAudit
      tags:
        - Plataforma
      summary: Consultar la auditoría técnica
      description: Solo el SA. Nunca incluye contenido comercial (RF-022).
      parameters:
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: tipo
          in: query
          required: false
          schema:
            type: string
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Registros, del más reciente al más antiguo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechnicalAuditEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
  /plataforma/panel:
    get:
      operationId: getTechnicalPanel
      tags:
        - Plataforma
      summary: Panel técnico
      description: Solo el SA. Errores internos recientes y estado de los trabajos y del outbox (RF-016).
      responses:
        '200':
          description: Estado de la plataforma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalPanel'
        '401': *a1
        '403': *a2
  /soporte/tickets:
    get:
      operationId: listTenantTickets
      tags:
        - Soporte
      summary: Tickets del comercio
      description: 'AC: todos los del comercio. AS: los que envió.'
      responses:
        '200':
          description: Tickets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketSummary'
        '401': *a1
        '403': *a2
    post:
      operationId: createTicket
      tags:
        - Soporte
      summary: Enviar un ticket de soporte
      description: AC o AS (RF-017). Sin datos comerciales adjuntos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        '201':
          description: Ticket creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '409':
          $ref: '#/components/responses/Conflict'
  /soporte/tickets/{id}:
    get:
      operationId: getTenantTicket
      tags:
        - Soporte
      summary: Consultar un ticket del comercio
      description: Un ticket de otro comercio se responde como inexistente.
      parameters: *a3
      responses:
        '200':
          description: El ticket con su conversación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *a1
        '403': *a2
        '404':
          $ref: '#/components/responses/NotFound'
  /organizacion/estructura:
    get:
      operationId: getStructure
      tags:
        - Organización
      summary: Jerarquía del comercio
      description: Comercio > Sucursales > Cajas (RF-027). Solo el AC de su comercio.
      parameters: &a11
        - name: incluirBajas
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
      responses:
        '200':
          description: La estructura.
          content:
