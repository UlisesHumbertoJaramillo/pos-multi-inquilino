components:
  securitySchemes:
    tokenAcceso:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso de vida corta, obtenido con /auth/login o /auth/renovar.
  responses:
    BadRequest:
      description: Datos inválidos o token de un solo uso inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Sin token válido, credenciales incorrectas o sesión vencida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: El rol activo o el ámbito no permiten la acción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: No existe, o pertenece a otro comercio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Una regla de negocio impidió la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Locked:
      description: Credencial bloqueada por intentos fallidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Se superó el límite de frecuencia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: El cuerpo de la solicitud supera el tamaño permitido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - estado
      properties:
        estado:
          type: string
          const: ok
    ApiError:
      description: Respuesta de error uniforme, sin detalles internos (Const. 17).
      type: object
      additionalProperties: false
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          description: Código estable, para que el frontend decida qué mostrar.
        mensaje:
          type: string
          description: Mensaje para el usuario, en español.
    Message:
      type: object
      additionalProperties: false
      required:
        - mensaje
      properties:
        mensaje:
          type: string
    Role:
      type: string
      enum:
        - SA
        - AC
        - AS
        - VO
    SessionUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - nombre
        - comercioId
        - roles
        - rolActivo
        - sucursales
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        nombre:
          type: string
        comercioId:
          description: Nulo para el Super Administrador.
          type:
            - string
            - 'null'
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        rolActivo:
          description: Nulo hasta que el usuario elige su rol en el primer ingreso.
          oneOf:
            - $ref: '#/components/schemas/Role'
            - type: 'null'
        sucursales:
          description: Sucursales del rol activo.
          type: array
          items:
            type: string
            format: uuid
    SessionTokens:
      type: object
      additionalProperties: false
      required:
        - tokenAcceso
        - tokenAccesoVenceEn
        - tokenRenovacion
        - sesionVenceEn
        - usuario
        - requiereElegirRol
      properties:
        tokenAcceso:
          type: string
        tokenAccesoVenceEn:
          type: string
          format: date-time
        tokenRenovacion:
          type: string
        sesionVenceEn:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/SessionUser'
        requiereElegirRol:
          type: boolean
    ActiveRoleChange:
      type: object
      additionalProperties: false
      required:
        - tokenAcceso
        - tokenAccesoVenceEn
        - usuario
      properties:
        tokenAcceso:
          type: string
        tokenAccesoVenceEn:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/SessionUser'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - contrasena
      properties:
        email:
          type: string
          format: email
        contrasena:
          type: string
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - tokenRenovacion
      properties:
        tokenRenovacion:
          type: string
    ActiveRoleRequest:
      type: object
      additionalProperties: false
      required:
        - rol
      properties:
        rol:
          $ref: '#/components/schemas/Role'
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - nuevaContrasena
      properties:
        token:
          type: string
        nuevaContrasena:
          type: string
          minLength: 10
          maxLength: 128
    PinRequest:
      type: object
      additionalProperties: false
      required:
        - pin
