        operacionRef:
          type: string
        sucursalId:
          type: string
          format: uuid
        solicitanteId:
          type: string
          format: uuid
        autorizanteId:
          type: string
          format: uuid
        emitidaEn:
          type: string
          format: date-time
        usada:
          type: boolean
    TenantStatus:
      type: string
